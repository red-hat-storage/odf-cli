name: Go Test

on:
  pull_request:
  push:
    tags:
      - v*
    branches:
      - main
      - release-*

defaults:
  run:
    # reference: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#using-a-specific-shell
    shell: bash --noprofile --norc -eo pipefail -x {0}

# cancel the in-progress workflow when PR is refreshed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ODF_SKIP_PROMPTS: true
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: consider (pre-job) debugging
        uses: ./.github/workflows/upterm_debug
        with:
          debug-ci: ${{ contains(github.event.pull_request.labels.*.name, 'debug-ci') }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Minikube
        run: tests/github-action-helper.sh install_minikube_with_none_driver v1.32.13

      - name: print k8s cluster status
        run: |
          kubectl cluster-info
          kubectl get pods -n kube-system
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes -o wide

      - name: use local disk
        run: tests/github-action-helper.sh use_local_disk

      - name: deploy rook cluster
        run: tests/github-action-helper.sh deploy_rook openshift-storage openshift-storage

      - name: Build odf-cli
        shell: bash
        run: make build

      - name: Run unit tests
        shell: bash
        run: make test

      - name: Test odf-cli commands
        shell: bash
        run: |
          ./bin/odf --help
          tests/github-action-helper.sh install_dummy_storagecluster
          ./bin/odf get health
          ./bin/odf ceph status
          ./bin/odf get rook-status

      - name: collect common logs
        if: always()
        uses: ./.github/workflows/collect-logs
        with:
          name: go-test
